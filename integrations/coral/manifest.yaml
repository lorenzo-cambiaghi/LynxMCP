# Coral source spec for Lynx (https://github.com/lorenzo-cambiaghi/LynxMCP)
#
# Exposes Lynx's local semantic code search as SQL tables inside Coral
# (https://github.com/withcoral/coral), so agents can JOIN code-search
# results with live data from other sources:
#
#   SELECT s.file, s.symbol, s.score
#   FROM lynx.search(q => 'retry logic for payment webhooks')
#   ORDER BY s.score DESC LIMIT 5
#
# Prerequisite: the Lynx local API must be running —
#   lynx manager ui --port 8765 --no-browser
# Everything stays on localhost; no credentials involved.
#
# Validate after edits with Coral's source tooling (`coral source` docs:
# https://withcoral.com/docs/guides/write-a-custom-source).

name: lynx
# 0.1.0 = the search source merged into the community repo; 0.2.0 adds the
# six code-graph functions.
version: 0.2.0
dsl_version: 3
backend: http
description: >-
  100% local semantic code search over your codebases, library docs, and
  PDFs (Lynx MCP server). Hybrid dense+BM25 retrieval with AST-aware
  chunks: every row carries file, symbol, line range, and the code itself.

inputs:
  LYNX_PORT:
    kind: variable
    default: "8765"
    hint: Port of the local Lynx API (`lynx manager ui --port 8765 --no-browser`).

base_url: http://127.0.0.1:{{input.LYNX_PORT}}

test_queries:
  - SELECT name, type, chunk_count FROM lynx.sources
  - SELECT file, symbol, score FROM lynx.search(q => 'where passwords are hashed') LIMIT 5

tables:
  - name: sources
    description: Sources configured in the local Lynx index (codebases, docs sites, PDF folders).
    request:
      method: GET
      path: /api/v1/sources
    response:
      rows_path:
        - sources
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Source name — pass it as the `source` argument of lynx.search.
        expr: { kind: path, path: [name] }
      - name: type
        type: Utf8
        nullable: false
        description: Source type (codebase | webdoc | pdf).
        expr: { kind: path, path: [type] }
      - name: location
        type: Utf8
        nullable: true
        description: Indexed path or crawled URL.
        expr: { kind: path, path: [location] }
      - name: chunk_count
        type: Int64
        nullable: true
        description: Number of indexed chunks.
        expr: { kind: path, path: [chunk_count] }
      - name: last_update
        type: Utf8
        nullable: true
        description: Timestamp of the last index update.
        expr: { kind: path, path: [last_update] }

functions:
  # Ranked retrieval surface → must be a `kind: search` function (Coral spec),
  # not a table with filters. Called as lynx.search(q => '...').
  - name: search
    kind: search
    description: >-
      Semantic + lexical hybrid search over the indexed sources. Phrase the
      query as what the code DOES ("method that clamps camera zoom"), not as
      an identifier. Omit `source` to search every source at once. Control the
      result count with SQL `LIMIT` (Coral maps it to the `top_k` request
      param). Call it as a function: lynx.search(q => '...').
    search_limits:
      default_top_k: 8
      max_top_k: 50
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind: { arg: q }
      - name: source
        required: false
        bind: { arg: source }
    request:
      method: GET
      path: /api/v1/search
      query:
        - name: q
          from: arg
          key: q
        - name: source
          from: arg
          key: source
    response:
      rows_path:
        - results
    # SQL `LIMIT` → the Lynx `top_k` query param. Lynx clamps top_k to [1, 50]
    # (GET /api/v1/search), so a larger LIMIT is capped at 50 server-side.
    pagination:
      mode: none
      page_size:
        default: 8
        max: 50
        query_param: top_k
    columns:
      - name: source
        type: Utf8
        nullable: false
        description: Which Lynx source produced this hit.
        expr: { kind: path, path: [source] }
      - name: file
        type: Utf8
        nullable: false
        description: File name of the hit.
        expr: { kind: path, path: [file] }
      - name: file_path
        type: Utf8
        nullable: true
        description: Full path of the file inside the indexed tree.
        expr: { kind: path, path: [file_path] }
      - name: symbol
        type: Utf8
        nullable: true
        description: Qualified symbol of the AST chunk (e.g. MyClass.handle_click).
        expr: { kind: path, path: [symbol] }
      - name: kind
        type: Utf8
        nullable: true
        description: Symbol kind (function, class, method, ...).
        expr: { kind: path, path: [kind] }
      - name: language
        type: Utf8
        nullable: true
        description: Programming language of the chunk.
        expr: { kind: path, path: [language] }
      - name: start_line
        type: Int64
        nullable: true
        description: First line of the chunk (1-based).
        expr: { kind: path, path: [start_line] }
      - name: end_line
        type: Int64
        nullable: true
        description: Last line of the chunk.
        expr: { kind: path, path: [end_line] }
      - name: score
        type: Float64
        nullable: false
        description: Relevance score (hybrid RRF — ~0.03 is already a strong match).
        expr: { kind: path, path: [score] }
      - name: content
        type: Utf8
        nullable: true
        description: The code chunk itself.
        expr: { kind: path, path: [content] }

  # --- Code knowledge-graph functions --------------------------------------
  # One function per graph operation over the same /api/v1/graph endpoint, so
  # an agent can pivot from a lynx.search hit's `symbol` to its structural
  # neighbourhood and JOIN that blast radius with live data (PRs, tickets,
  # owners). Symbol matching is fuzzy (case-insensitive substring), same as
  # Lynx's `graph_query` MCP tool. Every function returns flat edge rows
  # (`from_*` -> `to_*` with `relation`); SQL `LIMIT` caps the edge count
  # (mapped to the API's `limit`, server-clamped to [1, 200]). `source` is
  # optional when exactly one indexed source has the graph layer; only
  # codebase sources with the graph layer enabled answer these.
  - name: callers
    description: >-
      Inbound call edges — who calls `symbol`. The blast radius of a change:
      pivot from a lynx.search hit to everything that would break if you touch
      it. Call as lynx.callers(symbol => 'MyClass.handle').
    args: &graph_args
      - name: symbol
        required: true
        bind: { arg: symbol }
      - name: source
        required: false
        bind: { arg: source }
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: callers
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
    response: &graph_response
      rows_path:
        - results
    # SQL `LIMIT` -> the Lynx `limit` query param (clamped to [1, 200]).
    pagination: &graph_pagination
      mode: none
      page_size:
        default: 50
        max: 200
        query_param: limit
    columns: &graph_columns
      - name: relation
        type: Utf8
        nullable: false
        description: Edge type (e.g. calls, inherits, imports).
        expr: { kind: path, path: [relation] }
      - name: base_kind
        type: Utf8
        nullable: true
        description: Normalised relation family for the edge.
        expr: { kind: path, path: [base_kind] }
      - name: confidence
        type: Utf8
        nullable: true
        description: Resolver confidence for the edge, when available.
        expr: { kind: path, path: [confidence] }
      - name: module
        type: Utf8
        nullable: true
        description: For `imports`, the imported module/path (the target node is often synthetic).
        expr: { kind: path, path: [module] }
      - name: from_symbol
        type: Utf8
        nullable: false
        description: Qualified symbol of the edge's source node.
        expr: { kind: path, path: [from_symbol] }
      - name: from_kind
        type: Utf8
        nullable: true
        description: Symbol kind of the source node (function, class, method, ...).
        expr: { kind: path, path: [from_kind] }
      - name: from_file
        type: Utf8
        nullable: true
        description: File of the source node.
        expr: { kind: path, path: [from_file] }
      - name: from_start_line
        type: Int64
        nullable: true
        description: First line of the source node (1-based).
        expr: { kind: path, path: [from_start_line] }
      - name: from_end_line
        type: Int64
        nullable: true
        description: Last line of the source node.
        expr: { kind: path, path: [from_end_line] }
      - name: to_symbol
        type: Utf8
        nullable: false
        description: Qualified symbol of the edge's target node.
        expr: { kind: path, path: [to_symbol] }
      - name: to_kind
        type: Utf8
        nullable: true
        description: Symbol kind of the target node.
        expr: { kind: path, path: [to_kind] }
      - name: to_file
        type: Utf8
        nullable: true
        description: File of the target node.
        expr: { kind: path, path: [to_file] }
      - name: to_start_line
        type: Int64
        nullable: true
        description: First line of the target node (1-based).
        expr: { kind: path, path: [to_start_line] }
      - name: to_end_line
        type: Int64
        nullable: true
        description: Last line of the target node.
        expr: { kind: path, path: [to_end_line] }
      - name: call_site_file
        type: Utf8
        nullable: true
        description: File where the edge occurs (the call site), when known.
        expr: { kind: path, path: [call_site_file] }
      - name: call_site_line
        type: Int64
        nullable: true
        description: Line of the call site, when known.
        expr: { kind: path, path: [call_site_line] }

  - name: callees
    description: >-
      Outbound call edges — what `symbol` calls. The direct dependencies of a
      function/method. Call as lynx.callees(symbol => 'MyClass.handle').
    args: *graph_args
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: callees
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
    response: *graph_response
    pagination: *graph_pagination
    columns: *graph_columns

  - name: subclasses
    description: >-
      Types that extend/implement `symbol` (inbound inheritance edges). Call as
      lynx.subclasses(symbol => 'BaseRepository').
    args: *graph_args
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: subclasses
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
    response: *graph_response
    pagination: *graph_pagination
    columns: *graph_columns

  - name: superclasses
    description: >-
      Types `symbol` extends/implements (outbound inheritance edges). Call as
      lynx.superclasses(symbol => 'SqlUserRepository').
    args: *graph_args
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: superclasses
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
    response: *graph_response
    pagination: *graph_pagination
    columns: *graph_columns

  - name: imports
    description: >-
      Modules/paths `symbol`'s file imports (outbound import edges). The
      imported target is in the `module` column. Call as
      lynx.imports(symbol => 'payment/webhooks.py').
    args: *graph_args
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: imports
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
    response: *graph_response
    pagination: *graph_pagination
    columns: *graph_columns

  - name: neighbors
    description: >-
      All edges incident to `symbol`, in either direction — the full local
      neighbourhood. Optionally filter to one `relation` and widen to `depth`
      hops. Call as lynx.neighbors(symbol => 'MyClass.handle').
    args:
      - name: symbol
        required: true
        bind: { arg: symbol }
      - name: source
        required: false
        bind: { arg: source }
      - name: relation
        required: false
        bind: { arg: relation }
      - name: depth
        required: false
        bind: { arg: depth }
    request:
      method: GET
      path: /api/v1/graph
      query:
        - name: operation
          from: literal
          value: neighbors
        - name: symbol
          from: arg
          key: symbol
        - name: source
          from: arg
          key: source
        - name: relation
          from: arg
          key: relation
        - name: depth
          from: arg
          key: depth
    response: *graph_response
    pagination: *graph_pagination
    columns: *graph_columns
